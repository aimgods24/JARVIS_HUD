<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. ADVANCED MOBILE HUD</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-glow: rgba(0, 243, 255, 0.35);
            --bg-dark: #020b18;
            --panel-bg: rgba(4, 18, 38, 0.92);
        }

        body {
            background-color: var(--bg-dark); color: var(--neon-blue);
            font-family: 'Consolas', monospace; margin: 0; padding: 10px;
            display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;
        }

        .hud-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--neon-blue); padding-bottom: 5px; }
        
        /* Mobile-Friendly Layout & Scrollable History Terminal */
        .workspace { display: flex; flex-direction: column; flex: 1; gap: 10px; margin-top: 10px; overflow: hidden; }
        
        #chat-terminal {
            flex: 1; background: var(--panel-bg); border: 1px solid var(--neon-blue);
            border-radius: 6px; padding: 10px; overflow-y: auto; display: flex;
            flex-direction: column; gap: 8px; max-height: 45vh;
        }

        .msg { line-height: 1.4; font-size: 13px; word-wrap: break-word; }
        .msg-user { color: #fff; text-align: right; }
        .msg-jarvis { color: var(--neon-blue); }

        /* GPS Map Drawer */
        #map-panel { height: 200px; border: 1px solid var(--neon-blue); border-radius: 6px; position: relative; }
        #leaflet-map { width: 100%; height: 100%; border-radius: 6px; }

        /* Custom Dynamic Orb Icon on Map */
        .hud-orb-marker {
            width: 20px; height: 20px; background: #00f3ff; border-radius: 50%;
            box-shadow: 0 0 15px #00f3ff; border: 2px solid #fff; animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 0% { transform: scale(0.9); box-shadow: 0 0 10px #00f3ff; } 50% { transform: scale(1.2); box-shadow: 0 0 20px #00f3ff; } 100% { transform: scale(0.9); box-shadow: 0 0 10px #00f3ff; } }

        .input-bar { display: flex; gap: 6px; margin-top: 5px; }
        textarea { flex: 1; height: 40px; background: rgba(0,0,0,0.7); border: 1px solid var(--neon-blue); color: var(--neon-blue); padding: 5px; }
        button { background: rgba(0, 243, 255, 0.2); border: 1px solid var(--neon-blue); color: var(--neon-blue); font-weight: bold; }
    </style>
</head>
<body>

    <div class="hud-header">
        <span>J.A.R.V.I.S. HUD</span>
        <button onclick="requestScreenWakeLock()">🔒 KEEP SCREEN AWAKE</button>
    </div>

    <div class="workspace">
        <div id="map-panel">
            <div id="leaflet-map"></div>
        </div>

        <div id="chat-terminal">
            <div class="msg msg-jarvis"><b>J.A.R.V.I.S.:</b> Systems online. High-precision GPS positioning engaged.</div>
        </div>
    </div>

    <div class="input-bar">
        <textarea id="userInput" placeholder="Command J.A.R.V.I.S..."></textarea>
        <button onclick="sendCommand()">SEND</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, userMarker;
        let wakeLockObj = null;

        // 1. Keep Mobile Screen Awake (Screen Wake Lock API)
        async function requestScreenWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLockObj = await navigator.wakeLock.request('screen');
                    alert("Screen Wake Lock Active: Display will remain powered on while HUD is active.");
                } else {
                    alert("Wake Lock API not supported on this browser.");
                }
            } catch (err) {
                console.log(err);
            }
        }

        // 2. High-Precision GPS Tracking Engine
        function initGPSMap() {
            map = L.map('leaflet-map').setView([0, 0], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

            const orbIcon = L.divIcon({ className: 'hud-orb-marker', iconSize: [20, 20] });

            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;

                    if (!userMarker) {
                        userMarker = L.marker([lat, lon], { icon: orbIcon }).addTo(map);
                    } else {
                        userMarker.setLatLng([lat, lon]);
                    }
                    map.setView([lat, lon], 16);
                }, (err) => console.log(err), { enableHighAccuracy: true, maximumAge: 1000 });
            }
        }

        window.onload = () => {
            initGPSMap();
            requestScreenWakeLock();
        };

        // 3. Command Handler & Deep Link Launcher
        async function sendCommand() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            const terminal = document.getElementById('chat-terminal');
            terminal.innerHTML += `<div class="msg msg-user"><b>YOU:</b> ${text}</div>`;
            input.value = '';

            try {
                const res = await fetch('/api/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });
                const data = await res.json();
                
                terminal.innerHTML += `<div class="msg msg-jarvis"><b>J.A.R.V.I.S.:</b> ${data.response}</div>`;
                terminal.scrollTop = terminal.scrollHeight;

                // Handle Mobile Deep Links
                if (data.app_intent) {
                    window.location.href = data.app_intent;
                }

                if (data.audio) {
                    let audio = new Audio('/api/audio?t=' + new Date().getTime());
                    audio.play();
                }
            } catch(e) {}
        }
    </script>
</body>
</html>
